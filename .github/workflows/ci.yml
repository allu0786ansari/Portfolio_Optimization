name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint-test:
    name: Lint, type-check, leakage gate, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Install locked deps (CPU torch)
        run: |
          bash scripts/install_deps.sh "dev rl ml serving data dashboard"
          uv pip install --system --no-deps -e .

      - name: Ruff
        run: ruff check .

      - name: Mypy (src/pfo)
        run: mypy

      - name: Leakage suite (Phase 0 exit gate)
        run: pytest tests/leakage -m leakage -v

      - name: Full test suite with coverage
        env:
          API_KEY: ci-test-key
        run: pytest tests --cov --cov-report=term --cov-report=xml

      - name: Leakage scan + corrected-baseline smoke run (synthetic data)
        run: |
          pfo-leakage-scan --source synthetic --out ci-artifacts/leakage_scan_synthetic.json
          pfo-v1-baseline --source synthetic --rl-timesteps 2000 --n-boot 200 --synthetic-days 1300 \
            --out ci-artifacts/baseline_smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-ci-artifacts
          path: |
            ci-artifacts/
            coverage.xml

  windows:
    name: Windows (tasks.ps1, as run from VS Code)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: tasks.ps1 install  (uv sync from uv.lock; PyPI torch is CPU-only on Windows)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tasks.ps1 install

      - name: tasks.ps1 check  (ruff, mypy, leakage gate, full test suite)
        shell: powershell
        env:
          API_KEY: ci-test-key
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tasks.ps1 check

      - name: tasks.ps1 phase0-smoke  (corrected baseline CLI, UTF-8 report on Windows)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tasks.ps1 phase0-smoke --rl-timesteps 2000 --n-boot 100 --synthetic-days 1300
          if (-not (Select-String -Path reports\phase0\synthetic\report.md -Pattern "Corrected v1 baseline" -Quiet)) { exit 1 }

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/Dockerfile
          tags: portfolio-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: API smoke test (/health, fail-closed auth)
        run: |
          docker run -d --name api -e API_KEY=ci-key -e MLFLOW_TRACKING_URI=http://127.0.0.1:9 -p 8000:8000 portfolio-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          curl -fsS http://localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict -H 'Content-Type: application/json' -d '{"tickers":["AAPL","MSFT"]}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/retrain/status -H 'X-API-Key: ci-key')" = "200"
          docker exec api sh -c 'test ! -e /app/.env'  # no secrets baked into the image
          docker logs api | tail -20
          docker rm -f api

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          tags: portfolio-dashboard:ci
          load: true
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Dashboard smoke test
        run: |
          docker run -d --name dash -p 8501:8501 portfolio-dashboard:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8501/_stcore/health && break; sleep 2; done
          curl -fsS http://localhost:8501/_stcore/health
          docker rm -f dash
