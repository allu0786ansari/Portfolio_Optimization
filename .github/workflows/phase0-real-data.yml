name: Phase 0 - real data run

# Fresh market-data download + the Phase 0 exit gate and corrected baseline on
# real data. Runs on GitHub's runners (they can reach Yahoo Finance).
# Outputs are uploaded as artifacts and copied into runlog/phase0/artifacts/real/.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date to download"
        default: "2010-01-01"
      rl_timesteps:
        description: "PPO timesteps per walk-forward fold (0 = skip RL)"
        default: "30000"
  push:
    branches: [phase0]
    paths:
      - ".github/workflows/phase0-real-data.yml"
      - "src/pfo/data/download.py"

permissions:
  contents: write   # the last step commits the outputs to runlog/phase0/artifacts/real/

defaults:
  run:
    shell: bash      # explicit bash => -eo pipefail (a failing command before "| tee" fails the step)

concurrency:
  group: phase0-real-data-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  START: ${{ github.event.inputs.start || '2010-01-01' }}
  RL_TIMESTEPS: ${{ github.event.inputs.rl_timesteps || '30000' }}

jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked deps (CPU torch)
        run: |
          bash scripts/install_deps.sh "dev rl ml serving data"
          uv pip install --system --no-deps -e .

      - name: 1. Fresh download (deletes old data, writes data/raw/_manifest.json)
        run: pfo-download --universe both --start "$START"

      - name: 2. Exit gate - leakage scan on real data
        run: pfo-leakage-scan --source v1 --universe both --out reports/phase0/leakage_scan_real.json

      - name: 3. Tests including the data-dependent v1 tests
        env:
          API_KEY: ci-test-key
        run: pytest tests -q -m "not slow" | tee reports/phase0/pytest_real_data.txt

      - name: 4. Corrected v1 baseline on real data
        run: |
          pfo-v1-baseline --source v1 --universe both --rl-timesteps "$RL_TIMESTEPS" --out reports/phase0/real \
            2>&1 | tee reports/phase0/real_baseline_log.txt
          cp data/raw/_manifest.json reports/phase0/data_manifest.json

      - name: Job summary
        if: always()
        run: |
          { echo "## Phase 0 real-data run"; echo; cat reports/phase0/real/report.md 2>/dev/null || echo "baseline did not finish"; } >> "$GITHUB_STEP_SUMMARY"

      - name: 5. Commit outputs to runlog/phase0/artifacts/real
        if: success()
        run: |
          DEST=runlog/phase0/artifacts/real
          mkdir -p "$DEST"
          cp reports/phase0/real/report.md reports/phase0/real/summary.json "$DEST"/
          cp reports/phase0/real/nifty/fold_metrics.csv "$DEST"/nifty_fold_metrics.csv
          cp reports/phase0/real/sp500/fold_metrics.csv "$DEST"/sp500_fold_metrics.csv
          cp reports/phase0/leakage_scan_real.json reports/phase0/data_manifest.json \
             reports/phase0/pytest_real_data.txt "$DEST"/
          sed 's/\x1b\[[0-9;]*m//g' reports/phase0/real_baseline_log.txt | grep -v "training .* steps" > "$DEST"/real_baseline_log.txt || true
          echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$DEST"/RUN_INFO.txt
          echo "commit: ${{ github.sha }}" >> "$DEST"/RUN_INFO.txt
          echo "finished_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$DEST"/RUN_INFO.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "phase0: real-data run outputs (workflow run ${{ github.run_id }})" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-real-reports
          path: reports/phase0/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-data-raw
          path: data/raw/
          retention-days: 30
