# Install once:  uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(Document/|backtesting/backtest_report\.html)
      - id: end-of-file-fixer
        exclude: ^(Document/|backtesting/backtest_report\.html)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-env-files
        name: forbid committing .env files
        entry: .env files must not be committed (use .env.example)
        language: fail
        files: (^|/)\.env$
