# Local full stack. Secrets come from .env (copy .env.example). Nothing secret is
# hard-coded here or baked into images (Phase 0 fix).
#   make up        -> docker compose up --build
services:

  mlflow:
    build:
      context: mlops/mlflow
      args:
        MLFLOW_VERSION: "3.18.0"     # keep in step with mlflow-skinny in uv.lock
    container_name: portfolio-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow-data      # named volume (v1 bind-mounted a file that Docker turned into a directory)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: serving/Dockerfile
    container_name: portfolio-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_DISABLE_AGENT_HINT=1
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
      - ./models/rl_agent/saved_models:/app/models/rl_agent/saved_models
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: portfolio-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed:ro
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: portfolio-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./mlops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: portfolio-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Airflow — lightweight orchestrator (calls the API's /retrain/* endpoints) ──
  airflow-init:
    build:
      context: .
      dockerfile: mlops/airflow/Dockerfile
    container_name: portfolio-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname AI --lastname Engineer --role Admin --email admin@example.com || true
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
      TRAINING_SERVICE_URL: http://api:8000
      TRAINING_SERVICE_API_KEY: ${TRAINING_SERVICE_API_KEY:?set TRAINING_SERVICE_API_KEY in .env}
    volumes:
      - airflow_db:/opt/airflow
      - ./mlops/airflow/dags:/opt/airflow/dags
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: mlops/airflow/Dockerfile
    container_name: portfolio-airflow-webserver
    ports:
      - "8080:8080"
    command: airflow webserver
    environment: *airflow-env
    volumes:
      - airflow_db:/opt/airflow
      - ./mlops/airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: mlops/airflow/Dockerfile
    container_name: portfolio-airflow-scheduler
    command: airflow scheduler
    environment: *airflow-env
    volumes:
      - airflow_db:/opt/airflow
      - ./mlops/airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
  airflow_db:
