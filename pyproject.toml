[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-optimizer"
version = "2.0.0a0"
description = "Hybrid classical-quantum portfolio optimization platform (v2, phase 0: leakage-safe core)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Allaudin Ansari" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "cvxpy>=1.6",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.50", "requests>=2.32", "dvc>=3.50"]
ml = ["torch>=2.8", "mlflow-skinny>=3.10,<4", "optuna>=4.0", "statsmodels>=0.14"]
rl = ["torch>=2.8", "gymnasium>=1.0,<2", "stable-baselines3>=2.6", "tqdm>=4.66", "rich>=13"]
serving = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "mlflow-skinny>=3.10,<4",
    "torch>=2.8",
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.6",
    "tqdm>=4.66",
    "rich>=13",
    "yfinance>=0.2.50",
]
dashboard = ["streamlit>=1.40", "plotly>=5.24", "httpx>=0.27"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
pfo-v1-baseline = "pfo.reports.v1_baseline:main"
pfo-leakage-scan = "pfo.reports.leakage_scan:main"
pfo-download = "pfo.data.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["Document", "backtesting/backtest_report.html"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Legacy v1 scripts insert the repo root on sys.path before importing project modules.
"data/**" = ["E402", "UP", "B"]
"models/**" = ["E402", "UP", "B"]
"backtesting/**" = ["E402", "UP", "B"]
"serving/**" = ["E402", "UP", "B"]
"dashboard/**" = ["E402", "UP", "B"]
"mlops/**" = ["E402", "UP", "B"]
"tests/**" = ["E402", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/pfo"]
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
pythonpath = [".", "src"]
markers = [
    "leakage: anti look-ahead / leakage tests (Phase 0 exit gate)",
    "slow: long-running tests (RL training etc.)",
    "needs_data: requires downloaded market data under data/processed",
]

[tool.coverage.run]
source = ["src/pfo"]
